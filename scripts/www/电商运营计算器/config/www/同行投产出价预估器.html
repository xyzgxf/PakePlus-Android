<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同行投产出价预估计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4">
            <h1 class="text-2xl font-bold text-white text-center">同行投产出价预估计算器</h1>
        </div>
        
        <div class="p-6">
            <!-- 折扣模式 -->
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">折扣模式</h2>
                <p class="text-gray-600 mb-4 text-sm">建议近期多刷几次商品链接、多看几天，持续观察更久，才能更好监控同行数据；取最大折扣值代入计算，看的时间越久，折扣越大，数据越真实、越贴近实际。</p>
                
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 px-4 py-3 text-left font-medium text-gray-700">优惠金额</th>
                                <th class="border border-gray-300 px-4 py-3 text-left font-medium text-gray-700">券后价</th>
                                <th class="border border-gray-300 px-4 py-3 text-left font-medium text-gray-700">预估投产【范围】</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="border border-gray-300 px-4 py-3">
                                    <input type="number" id="discount-amount" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入优惠金额" oninput="calculateDiscount()">
                                </td>
                                <td class="border border-gray-300 px-4 py-3">
                                    <input type="number" id="after-coupon-price" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入券后价" oninput="calculateDiscount()">
                                </td>
                                <td class="border border-gray-300 px-4 py-3" id="roi-1">--</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3" id="roi-2">--</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3" id="roi-3">--</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- 出价模式 -->
            <div>
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">出价模式</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 px-4 py-3 text-left font-medium text-gray-700">优惠金额</th>
                                <th class="border border-gray-300 px-4 py-3 text-left font-medium text-gray-700">券后价</th>
                                <th class="border border-gray-300 px-4 py-3 text-left font-medium text-gray-700">预估出价【范围】</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="border border-gray-300 px-4 py-3">
                                    <input type="number" id="bid-amount" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入优惠金额" oninput="calculateBid()">
                                </td>
                                <td class="border border-gray-300 px-4 py-3">
                                    <input type="number" id="bid-coupon-price" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入券后价(参考)" oninput="calculateBid()">
                                </td>
                                <td class="border border-gray-300 px-4 py-3" id="bid-1">--</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3" id="bid-2">--</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3"></td>
                                <td class="border border-gray-300 px-4 py-3" id="bid-3">--</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="bg-gray-50 px-6 py-3 text-right text-gray-500 text-sm">
            作者v:txp80290335
        </div>
    </div>

    <script>
        function calculateDiscount() {
            const discountAmount = parseFloat(document.getElementById('discount-amount').value) || 0;
            const afterCouponPrice = parseFloat(document.getElementById('after-coupon-price').value) || 0;
            
            if (discountAmount > 0) {
                const originalPrice = discountAmount + afterCouponPrice;
                const roi1 = (originalPrice / (discountAmount * 1.1)).toFixed(2);
                const roi2 = (originalPrice / (discountAmount * 1.2)).toFixed(2);
                const roi3 = (originalPrice / (discountAmount * 1.3)).toFixed(2);
                
                document.getElementById('roi-1').textContent = roi1;
                document.getElementById('roi-2').textContent = roi2;
                document.getElementById('roi-3').textContent = roi3;
            } else {
                document.getElementById('roi-1').textContent = '--';
                document.getElementById('roi-2').textContent = '--';
                document.getElementById('roi-3').textContent = '--';
            }
        }
        
        function calculateBid() {
            const bidAmount = parseFloat(document.getElementById('bid-amount').value) || 0;
            
            if (bidAmount > 0) {
                const bid1 = (bidAmount * 1.2).toFixed(2);
                const bid2 = (bidAmount * 1.25).toFixed(2);
                const bid3 = (bidAmount * 1.35).toFixed(2);
                
                document.getElementById('bid-1').textContent = bid1;
                document.getElementById('bid-2').textContent = bid2;
                document.getElementById('bid-3').textContent = bid3;
            } else {
                document.getElementById('bid-1').textContent = '--';
                document.getElementById('bid-2').textContent = '--';
                document.getElementById('bid-3').textContent = '--';
            }
        }
    </script>
</body>
</html>
