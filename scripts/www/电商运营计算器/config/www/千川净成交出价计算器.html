<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>千川净成交出价计算器</title>
  <style>
    * {box-sizing: border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
    body{background:#f5f7fa;padding:24px;max-width:520px;margin:0 auto;}
    .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px #00000014;}
    h2{text-align:center;margin-bottom:24px;color:#222;}
    .item{margin-bottom:18px;}
    label{display:block;margin-bottom:6px;color:#444;font-size:15px;}
    input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:16px;}
    .result-box{margin-top:22px;padding:18px;background:#fff8e8;border-radius:12px;}
    .tip{margin-top:12px;font-size:13px;color:#777;line-height:1.6}
    .val{font-size:22px;font-weight:bold;color:#e6642c;margin:8px 0;}
  </style>
</head>
<body>
<div class="card">
  <h2>千川净成交出价计算器</h2>

  <div class="item">
    <label>售价（元）</label>
    <input id="price" type="number" placeholder="输入商品售价" step="0.01"/>
  </div>

  <div class="item">
    <label>佣金率（%）</label>
    <input id="rate" type="number" placeholder="输入佣金率，如10" step="0.01"/>
  </div>

  <div class="result-box">
    <div>参考档位倍数：<span id="multi"></span></div>
    <div class="val">建议出价：<span id="out"></span></div>
    <div class="tip">规则：售价、佣金率取较大值匹配档位<br/>公式：(100 ÷ 佣金率) × 出价倍数</div>
  </div>
</div>

<script>
const priceEl = document.getElementById('price');
const rateEl = document.getElementById('rate');
const multiEl = document.getElementById('multi');
const outEl = document.getElementById('out');

function calc(){
  const price = Number(priceEl.value);
  const rate = Number(rateEl.value);
  if(!price || !rate || rate <= 0){
    multiEl.innerText = "-";
    outEl.innerText = "-";
    return;
  }

  // 取售价、佣金率两者较大值
  const refVal = Math.max(price, rate);
  let minMul, maxMul;

  if(refVal <10){
    minMul = 0.7; maxMul =0.75;
  }else if(refVal >=10 && refVal <=25){
    minMul =0.8; maxMul=0.95;
  }else if(refVal >=26 && refVal <=35){
    minMul=1.0; maxMul=1.2;
  }else if(refVal >=36 && refVal <=50){
    minMul=1.15; maxMul=1.3;
  }else{
    // >50 按截图示例 1.45倍
    minMul=1.4; maxMul=1.5;
  }

  const base = 100 / rate;
  const low = base * minMul;
  const high = base * maxMul;

  multiEl.innerText = `${minMul} ~ ${maxMul}`;
  outEl.innerText = `${low.toFixed(2)} ~ ${high.toFixed(2)}`;
}

priceEl.addEventListener('input', calc);
rateEl.addEventListener('input', calc);
</script>
</body>
</html>
