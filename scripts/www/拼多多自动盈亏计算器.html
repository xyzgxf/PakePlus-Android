<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼多多自动盈亏计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-full overflow-x-auto">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">拼多多自动盈亏计算器</h1>
        
        <div class="mb-4 flex gap-4">
            <button id="addRow" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium transition-colors">
                + 添加一行
            </button>
            <button id="resetAll" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded font-medium transition-colors">
                重置所有
            </button>
        </div>

        <table class="w-full border-collapse bg-white shadow-lg rounded-lg overflow-hidden">
            <thead>
                <tr>
                    <th class="border border-gray-300 px-2 py-3 bg-red-500 text-white font-bold">必填</th>
                    <th class="border border-gray-300 px-2 py-3 bg-red-500 text-white font-bold">必填</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-yellow-500 text-white font-bold">手动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-yellow-500 text-white font-bold">手动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-yellow-500 text-white font-bold">手动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-green-500 text-white font-bold">自动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-yellow-500 text-white font-bold">手动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-yellow-500 text-white font-bold">手动</th>
                    <th class="border border-gray-300 px-2 py-3 bg-gray-500 text-white font-bold">操作</th>
                </tr>
                <tr>
                    <th class="border border-gray-300 px-2 py-2 bg-red-100 font-medium">售价（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-red-100 font-medium">成本（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">利润（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">毛利率%</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">理论持平投产</th>
                    <th class="border border-gray-300 px-2 py-2 bg-yellow-100 font-medium">实际投产</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">到手利润率</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">毛盈利（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">成交花费（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-yellow-100 font-medium">退款（单）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-yellow-100 font-medium">订单量</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">利润（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">净利润（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-green-100 font-medium">净利润率</th>
                    <th class="border border-gray-300 px-2 py-2 bg-yellow-100 font-medium">扣点%</th>
                    <th class="border border-gray-300 px-2 py-2 bg-yellow-100 font-medium">运费险（元）</th>
                    <th class="border border-gray-300 px-2 py-2 bg-gray-100 font-medium">删除</th>
                </tr>
            </thead>
            <tbody id="calculatorBody">
                <!-- 数据行将通过JS动态生成 -->
            </tbody>
        </table>

        <div class="mt-4 text-sm text-gray-600">
            <p>说明：</p>
            <ul class="list-disc list-inside ml-2">
                <li>红色背景列为必填项，黄色背景列为手动输入项，绿色背景列为自动计算项</li>
                <li>输入数值后会自动实时计算所有结果</li>
                <li>扣点默认值为0.6%，可根据实际情况修改</li>
                <li>支持添加和删除多行数据，方便同时计算多个产品</li>
            </ul>
        </div>
        
        <!-- 作者信息 -->
        <div class="mt-6 text-right text-sm text-gray-500">
            作者v:txp80290335
        </div>
    </div>

    <script>
        // 初始化表格，添加一行默认数据
        function initTable() {
            addRow();
        }

        // 添加一行
        function addRow() {
            const tbody = document.getElementById('calculatorBody');
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50';
            
            // 生成单元格HTML
            row.innerHTML = `
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="0.01" class="w-full p-1 border rounded text-center" data-field="price" value=""></td>
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="0.01" class="w-full p-1 border rounded text-center" data-field="cost" value=""></td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="profit">0.00</td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="grossMargin">0.00%</td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="breakEvenROI">0.000</td>
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="0.01" class="w-full p-1 border rounded text-center" data-field="actualROI" value=""></td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="netProfitRate">0.00%</td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="grossProfitPerOrder">0.00</td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="costPerOrder">0.00</td>
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="1" class="w-full p-1 border rounded text-center" data-field="refunds" value="0"></td>
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="1" class="w-full p-1 border rounded text-center" data-field="orders" value="0"></td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="totalProfit">0.00</td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="netProfit">0.00</td>
                <td class="border border-gray-300 px-2 py-1 bg-green-50 text-center" data-field="netProfitMargin">0.00%</td>
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="0.01" class="w-full p-1 border rounded text-center" data-field="platformFee" value="0.6"></td>
                <td class="border border-gray-300 px-2 py-1"><input type="number" step="0.01" class="w-full p-1 border rounded text-center" data-field="shippingInsurance" value="0"></td>
                <td class="border border-gray-300 px-2 py-1 text-center"><button class="deleteRow bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-sm">删除</button></td>
            `;
            
            tbody.appendChild(row);
            
            // 为输入框添加事件监听
            const inputs = row.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('input', () => calculateRow(row));
            });
            
            // 为删除按钮添加事件监听
            const deleteBtn = row.querySelector('.deleteRow');
            deleteBtn.addEventListener('click', () => {
                if (tbody.children.length > 1) {
                    row.remove();
                } else {
                    alert('至少保留一行数据');
                }
            });
        }

        // 计算单行数据
        function calculateRow(row) {
            // 获取输入值
            const price = parseFloat(row.querySelector('[data-field="price"]').value) || 0;
            const cost = parseFloat(row.querySelector('[data-field="cost"]').value) || 0;
            const actualROI = parseFloat(row.querySelector('[data-field="actualROI"]').value) || 0;
            const refunds = parseInt(row.querySelector('[data-field="refunds"]').value) || 0;
            const orders = parseInt(row.querySelector('[data-field="orders"]').value) || 0;
            const platformFee = parseFloat(row.querySelector('[data-field="platformFee"]').value) || 0;
            const shippingInsurance = parseFloat(row.querySelector('[data-field="shippingInsurance"]').value) || 0;
            
            // 计算自动列
            const profit = price - cost;
            const grossMargin = price > 0 ? (profit / price) * 100 : 0;
            const breakEvenROI = profit > 0 ? price / profit : 0;
            
            let netProfitRate = 0;
            let grossProfitPerOrder = 0;
            let costPerOrder = 0;
            let totalProfit = 0;
            let netProfit = 0;
            let netProfitMargin = 0;
            
            if (actualROI > 0 && price > 0) {
                grossProfitPerOrder = price - cost - (price / actualROI);
                netProfitRate = (grossProfitPerOrder / price) * 100;
                costPerOrder = price / actualROI;
                totalProfit = orders * grossProfitPerOrder;
                
                // 计算净利润
                const validOrders = orders - refunds;
                const validSales = price * validOrders;
                const totalCost = cost * validOrders;
                const totalPlatformFee = price * orders * (platformFee / 100);
                const totalShippingInsurance = shippingInsurance * orders;
                const totalAdCost = (price / actualROI) * orders;
                
                netProfit = validSales - totalCost - totalPlatformFee - totalShippingInsurance - totalAdCost;
                
                // 计算净利润率
                if (validSales > 0) {
                    netProfitMargin = (netProfit / validSales) * 100;
                }
            }
            
            // 更新显示
            row.querySelector('[data-field="profit"]').textContent = profit.toFixed(2);
            row.querySelector('[data-field="grossMargin"]').textContent = grossMargin.toFixed(2) + '%';
            row.querySelector('[data-field="breakEvenROI"]').textContent = breakEvenROI.toFixed(3);
            row.querySelector('[data-field="netProfitRate"]').textContent = netProfitRate.toFixed(2) + '%';
            row.querySelector('[data-field="grossProfitPerOrder"]').textContent = grossProfitPerOrder.toFixed(2);
            row.querySelector('[data-field="costPerOrder"]').textContent = costPerOrder.toFixed(2);
            row.querySelector('[data-field="totalProfit"]').textContent = totalProfit.toFixed(2);
            row.querySelector('[data-field="netProfit"]').textContent = netProfit.toFixed(2);
            row.querySelector('[data-field="netProfitMargin"]').textContent = netProfitMargin.toFixed(2) + '%';
            
            // 净利润为负时标红
            const netProfitCell = row.querySelector('[data-field="netProfit"]');
            const netProfitMarginCell = row.querySelector('[data-field="netProfitMargin"]');
            if (netProfit < 0) {
                netProfitCell.classList.add('text-red-600', 'font-bold');
                netProfitMarginCell.classList.add('text-red-600', 'font-bold');
            } else {
                netProfitCell.classList.remove('text-red-600', 'font-bold');
                netProfitMarginCell.classList.remove('text-red-600', 'font-bold');
            }
        }

        // 重置所有
        function resetAll() {
            if (confirm('确定要重置所有数据吗？')) {
                const tbody = document.getElementById('calculatorBody');
                tbody.innerHTML = '';
                addRow();
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            initTable();
            
            // 添加按钮事件
            document.getElementById('addRow').addEventListener('click', addRow);
            document.getElementById('resetAll').addEventListener('click', resetAll);
        });
    </script>
</body>
</html>
